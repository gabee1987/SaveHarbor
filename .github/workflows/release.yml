name: release

# A pushed tag vX.Y.Z builds the installer and the update feed and publishes them as a GitHub Release, which installed
# copies of SaveHarbor read for updates. Tags with a suffix (v2.4.0-beta.1) become pre-releases, which the app ignores.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Same version as the Velopack package in SaveHarbor.App.csproj.
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Releases come only from main: a tag on a feature or develop commit is refused before anything is built.
      - name: The tagged commit must be on main
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The tag $env:TAG points to a commit that is not on main. Merge to main, then tag there." }

      - name: Derive the version from the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:TAG' is not vX.Y.Z or vX.Y.Z-suffix." }
          $version = $env:TAG.Substring(1)
          $core = $Matches[1]
          $csproj = (Select-Xml -Path SaveHarbor.App/SaveHarbor.App.csproj -XPath '//Version').Node.InnerText
          if ($csproj -ne $core) { throw "SaveHarbor.App.csproj has Version $csproj; the tag needs $core." }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "IS_PRERELEASE=$(([bool]$Matches[2]).ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Restore the Google client file
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET_ENC_B64: ${{ secrets.GOOGLE_CLIENT_SECRET_ENC_B64 }}
        run: |
          if ($env:GOOGLE_CLIENT_SECRET_ENC_B64) {
            [IO.File]::WriteAllBytes("SaveHarbor.App/Configuration/google-client-secret.enc", [Convert]::FromBase64String($env:GOOGLE_CLIENT_SECRET_ENC_B64))
            Write-Host "Google client file restored."
          } else {
            Write-Host "::warning::GOOGLE_CLIENT_SECRET_ENC_B64 is not set; this build says 'not configured' for Google Drive."
          }

      - name: Test
        run: dotnet test SaveHarbor.sln -c Release

      - name: Publish
        run: dotnet publish SaveHarbor.App -c Release -r win-x64 --self-contained true -p:Version=${{ env.APP_VERSION }} -p:DebugType=none -o artifacts/publish

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: ./build/Get-ReleaseNotes.ps1 -Version $env:APP_VERSION -Out artifacts/notes.md

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release lets vpk build a delta package. The first release has none, so a failure is expected there.
      - name: Download the previous release
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN --outputDir artifacts/releases

      - name: Pack
        shell: pwsh
        run: |
          $arguments = @(
            'pack', '--packId', 'SaveHarborApp', '--packVersion', $env:APP_VERSION,
            '--packDir', 'artifacts/publish', '--mainExe', 'SaveHarbor.App.exe',
            '--packTitle', 'SaveHarbor', '--packAuthors', 'SaveHarbor',
            '--releaseNotes', 'artifacts/notes.md', '--outputDir', 'artifacts/releases')
          $icon = 'SaveHarbor.App/Resources/saveharbor.ico'
          if (Test-Path $icon) { $arguments += @('--icon', $icon) } else { Write-Host "::warning::$icon is missing; the installer uses the default icon." }
          vpk @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload to the GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $arguments = @(
            'upload', 'github', '--repoUrl', "https://github.com/${{ github.repository }}", '--token', $env:GITHUB_TOKEN,
            '--outputDir', 'artifacts/releases', '--releaseName', "SaveHarbor $env:APP_VERSION", '--tag', $env:TAG, '--publish')
          if ($env:IS_PRERELEASE -eq 'true') { $arguments += '--pre' }
          vpk @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
