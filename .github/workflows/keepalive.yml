name: keepalive

# A free Supabase project pauses after a week without requests. One small read a week keeps it active.
# Needs the repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (public values, not secrets).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read app_meta
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          curl -fsS --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/app_meta?select=key"
